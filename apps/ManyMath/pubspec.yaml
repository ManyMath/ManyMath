name: manymath
description: >-
  ManyMath, a focused LaTeX editor built on the RaTeX engine and ManyUI.
publish_to: 'none'

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  manyui:
    git:
      url: https://github.com/ManyMath/ManyUI.git
      ref: d5b8881a8a582ef0f6f5989addd6ab1fd4ef144c
      path: manyui
  ratex: ^0.0.1
  ratex_dart: ^0.0.1
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: Latin Modern Roman
      fonts:
        - asset: fonts/lmroman10-regular.otf
        - asset: fonts/lmroman10-bold.otf
          weight: 700
        - asset: fonts/lmroman10-italic.otf
          style: italic
        - asset: fonts/lmroman10-bolditalic.otf
          weight: 700
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: fonts/jetbrains-mono-var.ttf
        - asset: fonts/jetbrains-mono-var-italic.ttf
          style: italic
